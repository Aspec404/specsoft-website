<div class="sa-app" id="saApp">
  <canvas id="saBg" aria-hidden="true"></canvas>
  <div class="sa-back" id="saBack"></div>

  <aside class="sa-side" id="saSide">
    <button class="sa-x" id="saX" type="button" aria-label="Close menu">×</button>
    <button class="sa-collapse" id="saCollapse" type="button" aria-label="Collapse sidebar">‹</button>
    <a class="sa-logo" href="index.html" aria-label="SPECSOFT home">
      <img src="assets/specsoft-logo.png" alt="SPECSOFT">
    </a>
    <div class="sa-rule"></div>
    <nav class="sa-navs">
      <button class="sa-nav on" id="saNew" type="button"><i class="sa-fi" data-i="chat"><svg><use href="#i-chat"/></svg></i><span class="sa-t">New chat</span></button>
      <button class="sa-nav" id="saAssets" type="button"><i class="sa-fi" data-i="cube"><svg><use href="#i-cube"/></svg></i><span class="sa-t">Assets</span></button>
      <button class="sa-nav" id="saSearch" type="button"><i class="sa-fi" data-i="search"><svg><use href="#i-search"/></svg></i><span class="sa-t">Search</span></button>
      <button class="sa-nav" id="saLibrary" type="button"><i class="sa-fi" data-i="folder"><svg><use href="#i-folder"/></svg></i><span class="sa-t">Library</span></button>
    </nav>
    <div class="sa-list" id="saList"></div>
    <div class="sa-rule"></div>
    <button class="sa-nav sa-nav-s" id="saSettings" type="button"><i class="sa-fi" data-i="gear"><svg><use href="#i-gear"/></svg></i><span class="sa-t">Settings</span></button>
    <a class="sa-acct" href="profile.html" aria-label="Your profile"><span class="sa-ava" data-user-avatar style="--sp-size:40px"></span><span class="sa-t sa-acct-n"><b data-user-name></b><b class="sa-guest" data-guest-only hidden>Log in</b></span><i class="sa-fi sa-t sa-chev" data-i="chev"><svg><use href="#i-chev"/></svg></i></a>
  </aside>

  <main class="sa-main">
    <div class="sa-bgmark" aria-hidden="true">
      <svg viewBox="0 0 1000 940" preserveAspectRatio="xMinYMid slice"><g fill="currentColor"><polygon points="40,330 400,40 640,40 280,330"/><polygon points="300,310 560,120 700,260 440,450"/><polygon points="-40,900 300,640 400,730 60,990"/></g></svg>
    </div>
    <div class="sa-art" aria-hidden="true"><img src="assets/spectra/spectra-hero.png" alt="" onerror="this.parentNode.style.display='none'"></div>

    <header class="sa-top">
      <button class="sa-ico sa-menu-btn" id="saBurger" type="button" aria-label="Menu">☰</button>
      <img class="sa-face sa-face-s" src="assets/spectra/spectra-pfp.png" alt="Spectra">
      <span class="sa-top-t">Spectra</span>
    </header>

    <div class="sa-scroll" id="saScroll">
      <section class="sa-hero" id="saHero">
        <p class="sa-welcome">WELCOME TO</p>
        <h1 class="sa-wordmark"><img src="assets/specsoft-wordmark.png" alt="SPECSOFT"></h1>
        <p class="sa-tag">Chat. Create. Explore.</p>
        <div class="sa-hr"></div>
        <div class="sa-greet"><img class="sa-face sa-face-s" src="assets/spectra/spectra-pfp.png" alt="Spectra" title="Poke her"><p class="sa-sub sa-bubble" id="saBubble"></p></div>
        <div class="sa-sugs">
          <button type="button" class="sa-sug" data-p="Give me 5 original game ideas for a small indie team."><i class="sa-fi" data-i="spark"><svg><use href="#i-spark"/></svg></i>Generate an idea</button>
          <button type="button" class="sa-sug" data-p="Help me debug a Lua script for my Roblox game."><i class="sa-fi" data-i="code"><svg><use href="#i-code"/></svg></i>Help with code</button>
          <button type="button" class="sa-sug" data-p="Help me design a new feature for my Roblox game."><i class="sa-fi" data-i="gamepad"><svg><use href="#i-gamepad"/></svg></i>Roblox help</button>
          <button type="button" class="sa-sug" data-mode="search" data-p=""><i class="sa-fi" data-i="globe"><svg><use href="#i-globe"/></svg></i>Search the web</button>
          <button type="button" class="sa-sug" data-mode="research" data-p=""><i class="sa-fi" data-i="radar"><svg><use href="#i-radar"/></svg></i>Deep research</button>
          <button type="button" class="sa-sug" data-p=""><i class="sa-fi" data-i="pen"><svg><use href="#i-pen"/></svg></i>Just chat</button>
        </div>
      </section>
      <div id="saMsgs"></div>
    </div>

    <div class="sa-composer">
      <div class="sa-att" id="saAtt" hidden></div>
      <input type="file" id="saFile" multiple hidden accept="image/*,.txt,.md,.json,.js,.ts,.py,.lua,.luau,.html,.css,.csv,.xml,.yml,.yaml,.java,.c,.cpp,.cs,.sql,.sh,.log">
      <div class="sa-box">
        <button class="sa-persona" id="saPersona" type="button" aria-label="Choose persona"><i class="sa-fi" data-i="spark"><svg><use href="#i-spark"/></svg></i></button>
        <div class="sa-pmenu" id="saPMenu"></div>
        <textarea id="saInput" rows="1" maxlength="4000" placeholder="Send a message to Spectra..." aria-label="Message Spectra"></textarea>
        <button class="sa-send" id="saSend" type="button" aria-label="Send"><i class="sa-fi sa-i-send" data-i="send"><svg><use href="#i-send"/></svg></i><i class="sa-fi sa-i-stop" data-i="stop"><svg><use href="#i-stop"/></svg></i></button>
      </div>
      <div class="sa-hint">Enter to send · Shift+Enter for a new line · Spectra can make mistakes</div>
    </div>
  </main>
</div>

<div class="sa-modal" id="saModal"><div class="sa-card"><input id="saQ" autocomplete="off"><div id="saRes"></div></div></div>
<div class="sa-modal" id="saSet"><div class="sa-card sx" role="dialog" aria-modal="true" aria-label="Spectra settings">
  <div class="sx-h"><b>Settings</b><button class="sx-x" id="saSetClose" type="button" aria-label="Close settings">×</button></div>
  <div class="sx-b"><nav class="sx-nav" id="sxNav" aria-label="Settings sections"></nav><div class="sx-pane" id="sxPane"></div></div>
</div></div>
<div class="sa-toast" id="saToast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer></script>
<script src="spectra-bg.js" defer></script>
<script src="cursor.js" defer></script>
<script src="gate.js"></script>
<script src="seasons.js"></script>
