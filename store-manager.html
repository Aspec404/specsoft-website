<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Store Manager | SPECSOFT®</title>
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Store Manager: everything it needs lives in this one file. */
        .sm-app { position: relative; z-index: 2; flex: 1 1 auto; min-width: 0; width: min(1100px, 100%); margin: 0 auto; padding: 22px clamp(14px, 3vw, 30px) 80px; }
        .sm-app [hidden] { display: none !important; }
        .sm-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-bottom: 16px; border-bottom: 1px solid var(--border-subtle); }
        .sm-head h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.3px; margin-right: auto; }
        .sm-head a, .sm-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 0 14px; background: var(--bg-card); border: 1px solid var(--border-hover); border-radius: 9px; color: var(--text-primary); font: inherit; font-size: 13px; text-decoration: none; cursor: pointer; transition: border-color .2s, background .2s, opacity .2s; }
        .sm-head a:hover, .sm-btn:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-dim); }
        .sm-btn:disabled { opacity: .45; cursor: default; }
        .sm-btn--primary { background: var(--accent); border-color: var(--accent); color: var(--bg-base); font-weight: 600; }
        .sm-btn--primary:hover:not(:disabled) { background: var(--accent); opacity: .88; }
        .sm-btn--danger { color: #f23f43; }
        .sm-btn--sm { min-height: 30px; padding: 0 10px; font-size: 12px; }
        .sm-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 18px 0; }
        .sm-tab { height: 34px; padding: 0 16px; background: none; border: 1px solid var(--border-subtle); border-radius: 999px; color: var(--text-secondary); font: inherit; font-size: 13px; cursor: pointer; }
        .sm-tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg-base); font-weight: 600; }
        .sm-bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
        .sm-bar .sm-grow { flex: 1; }
        .sm-note { color: var(--text-secondary); font-size: 13px; line-height: 1.55; max-width: 70ch; }
        .sm-card { padding: 18px; background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 14px; margin-bottom: 16px; }
        .sm-card h2 { font-size: 16px; font-weight: 600; margin-bottom: 10px; }
        .sm-list { display: grid; gap: 8px; }
        .sm-row { display: grid; grid-template-columns: 46px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 12px; }
        .sm-row.is-off { opacity: .55; }
        .sm-thumb { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 10px; background: var(--bg-card-hover); border: 1px solid var(--border-subtle); font-size: 24px; overflow: hidden; }
        .sm-thumb img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .sm-main strong { display: block; font-size: 14px; font-weight: 600; }
        .sm-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; align-items: center; color: var(--text-secondary); font-size: 12px; font-family: var(--font-mono); }
        .sm-badge { padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border-hover); font-size: 11px; font-family: var(--font-sans); }
        .sm-badge--live { background: var(--accent); color: var(--bg-base); border-color: var(--accent); font-weight: 600; }
        .sm-actions { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
        .sm-empty { padding: 28px; text-align: center; color: var(--text-secondary); border: 1px dashed var(--border-hover); border-radius: 12px; font-size: 14px; }
        .sm-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
        .sm-form .sm-wide { grid-column: 1 / -1; }
        .sm-field label { display: block; margin-bottom: 5px; color: var(--text-secondary); font-size: 12px; }
        .sm-field input:not([type=checkbox]), .sm-field select, .sm-field textarea { width: 100%; min-height: 38px; padding: 8px 11px; background: var(--bg-base); border: 1px solid var(--border-hover); border-radius: 9px; color: var(--text-primary); font: inherit; font-size: 13px; }
        .sm-field textarea { resize: vertical; min-height: 70px; }
        .sm-field input:focus, .sm-field select:focus, .sm-field textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
        .sm-field .sm-hint { margin-top: 4px; color: var(--text-tertiary); font-size: 11.5px; }
        .sm-check { display: flex; align-items: center; gap: 8px; min-height: 38px; font-size: 13px; cursor: pointer; }
        .sm-check input { width: 17px; height: 17px; accent-color: var(--accent); }
        .sm-dlg { width: min(640px, calc(100vw - 24px)); max-height: calc(100vh - 30px); padding: 0; margin: auto; background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border-hover); border-radius: 16px; overflow: auto; }
        .sm-dlg::backdrop { background: rgba(0,0,0,.6); backdrop-filter: blur(4px); }
        .sm-dlg form { padding: 20px; }
        .sm-dlg h3 { font-size: 18px; margin-bottom: 14px; }
        .sm-dlg-foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
        .sm-toast { position: fixed; left: 50%; bottom: 24px; z-index: 600; max-width: min(92vw, 440px); padding: 10px 18px; border-radius: 12px; background: var(--text-primary); color: var(--bg-base); font-size: 13.5px; opacity: 0; transform: translate(-50%, 12px); pointer-events: none; transition: opacity .2s, transform .2s; }
        .sm-toast.is-on { opacity: 1; transform: translate(-50%, 0); }
        .sm-toast.is-bad { background: #f23f43; color: #fff; }
        .sm-gate { max-width: 560px; margin: 12vh auto; padding: 26px; background: var(--bg-card); border: 1px solid var(--border-hover); border-radius: 16px; }
        .sm-gate h1 { font-size: 22px; margin-bottom: 8px; }
        .sm-gate pre { margin-top: 12px; padding: 12px; background: var(--code-bg); border: 1px solid var(--border-subtle); border-radius: 10px; font-family: var(--font-mono); font-size: 12px; white-space: pre-wrap; word-break: break-all; color: var(--code-text); }
        .sm-stats { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
        .sm-stat { flex: 1 1 140px; padding: 14px; background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 12px; }
        .sm-stat strong { display: block; font-family: var(--font-mono); font-size: 22px; }
        .sm-stat span { color: var(--text-secondary); font-size: 12px; }
        .sm-dlg--wide { width: min(920px, calc(100vw - 24px)); }
        .sm-framefield { display: flex; align-items: center; gap: 26px; padding: 18px 22px; background: var(--bg-base); border: 1px solid var(--border-hover); border-radius: 9px; }
        .fd { padding: 20px; }
        .fd h3 { font-size: 18px; margin-bottom: 14px; }
        .fd select { min-height: 34px; padding: 0 10px; background: var(--bg-base); border: 1px solid var(--border-hover); border-radius: 9px; color: var(--text-primary); font: inherit; font-size: 13px; }
        .fd-stage { display: flex; align-items: center; justify-content: center; gap: 40px; padding: 26px 16px; margin-bottom: 14px; background: #0b0b0b; border: 1px solid var(--border-subtle); border-radius: 12px; }
        .fd-stage.is-light { background: #f2f2f2; color: #111; }
        .fd-stage.is-light .sp-avatar { color: #111; background: #ddd; }
        .fd-av { padding: 16px; }
        .fd-bar, .fd-tabs { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
        .fd-bar .sm-check { min-height: 34px; margin-left: 4px; }
        .fd-tabs .is-on { background: var(--accent); color: var(--bg-base); border-color: var(--accent); font-weight: 600; }
        .fd-sep { flex: 1; }
        .fd-ctl { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px 22px; padding: 16px; border: 1px solid var(--border-subtle); border-radius: 12px; }
        .fd-s label { display: flex; justify-content: space-between; margin-bottom: 4px; color: var(--text-secondary); font-size: 12px; }
        .fd-s .sm-check { justify-content: flex-start; margin: 0; color: var(--text-primary); font-size: 13px; }
        .fd-s output { font-family: var(--font-mono); color: var(--text-primary); }
        .fd-s input[type=range] { width: 100%; accent-color: var(--accent); }
        .fd-colors { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        .fd-colors input[type=color] { width: 40px; height: 34px; padding: 0; background: none; border: 1px solid var(--border-hover); border-radius: 8px; cursor: pointer; }
        .fd-x { width: 22px; height: 22px; margin-left: -4px; padding: 0; background: var(--bg-card); border: 1px solid var(--border-hover); border-radius: 50%; color: var(--text-secondary); line-height: 1; cursor: pointer; }
        .fd-wide { grid-column: 1 / -1; }
        .fd-stage--col { flex-direction: column; gap: 10px; }
        .sm-titlerow { display: flex; align-items: center; justify-content: center; gap: 2px; color: #f2f2f2; }
        .fd-stage.is-light .sm-titlerow { color: #111; }
        .sm-titleslot { display: inline-flex; }
        .sm-giftprev { display: flex; align-items: center; gap: 4px; min-height: 44px; padding: 8px 12px; font-size: 18px; background: var(--bg-base); border: 1px solid var(--border-subtle); border-radius: 10px; }
        .sm-giftprev .spt { margin-left: 0; }
        .sm-iconprev { display: grid; place-items: center; width: 44px; height: 44px; border: 1px dashed var(--border-hover); border-radius: 10px; font-size: 11px; color: var(--text-tertiary); background: repeating-conic-gradient(#8883 0 25%, transparent 0 50%) 0 0 / 12px 12px; }
        .sm-iconprev img { max-width: 36px; max-height: 36px; object-fit: contain; }
        .sm-titlepv { display: inline-flex; align-items: center; min-height: 40px; padding: 6px 14px; font-size: 18px; background: var(--bg-base); border: 1px solid var(--border-subtle); border-radius: 10px; color: var(--text-primary); }
        .sm-titlepv .spt { margin-left: 0; }
        .sm-thumb--title { width: auto; min-width: 46px; max-width: 120px; padding: 0 6px; font-size: 10px; }
        .sm-thumb--title .spt { margin-left: 0; }
        .sm-pv { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px; margin-bottom: 14px; background: var(--bg-base); border: 1px solid var(--border-subtle); border-radius: 12px; }
        .sm-pv[hidden] { display: none; }
        .sm-pv-note { font-size: 12px; color: var(--text-secondary); }
        .sm-pv-stage { padding: 12px; }
        .sm-multi { display: grid; gap: 2px; max-height: 190px; overflow: auto; padding: 8px 10px; background: var(--bg-base); border: 1px solid var(--border-hover); border-radius: 9px; }
        .sm-multi .sm-check { min-height: 30px; }
        .sm-warn { margin-bottom: 12px; padding: 10px 14px; border: 1px solid #f2a516; border-radius: 10px; font-size: 13px; line-height: 1.5; }
        .fd-tl input[type=range] { flex: 1; min-width: 140px; accent-color: var(--accent); }
        .fd-tl output { min-width: 48px; font-family: var(--font-mono); font-size: 12px; text-align: right; }
        .fd-imgrow { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
        .fd-thumb { width: 84px; height: 84px; object-fit: contain; border: 1px solid var(--border-subtle); border-radius: 10px; background: repeating-conic-gradient(#8883 0 25%, transparent 0 50%) 0 0 / 16px 16px; }
        .fd-empty { display: grid; place-items: center; width: 84px; height: 84px; border: 1px dashed var(--border-hover); border-radius: 10px; color: var(--text-tertiary); font-size: 11px; text-align: center; }
        .sm-badge--easy { color: #23a55a; border-color: #23a55a; }
        .sm-badge--medium { color: #3b9cff; border-color: #3b9cff; }
        .sm-badge--hard { color: #a66bff; border-color: #a66bff; }
        .sm-result { margin-top: 12px; padding: 12px 14px; background: var(--bg-base); border: 1px solid var(--border-subtle); border-radius: 10px; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.6; }
        @media (max-width: 640px) { .sm-row { grid-template-columns: 40px 1fr; } .sm-actions { grid-column: 1 / -1; justify-content: flex-start; } .sm-thumb { width: 40px; height: 40px; } }
    </style>
</head>
<body>
    <script>try{var t=localStorage.getItem('specsoft-theme');if(t==='light')document.body.classList.add('light-mode')}catch(e){}</script>
    <div class="grid-bg"></div><div class="scanlines"></div><div class="vignette"></div><div class="ambient-glow"></div>

    <div class="sm-app" id="app">
        <div class="sm-gate" id="gate"><h1>Store Manager</h1><p class="sm-note">Checking your access...</p></div>
        <div id="panel" hidden>
            <header class="sm-head">
                <h1>Store Manager</h1>
                <a href="store.html">View store</a>
            </header>
            <nav class="sm-tabs" id="tabs" role="tablist" aria-label="Manager sections"></nav>
            <section id="view"></section>
        </div>
    </div>

    <dialog class="sm-dlg" id="dlg"><form id="dlgForm" novalidate></form></dialog>
    <dialog class="sm-dlg sm-dlg--wide" id="dlgFrame" aria-label="Frame designer"><div id="frameBody"></div></dialog>
    <dialog class="sm-dlg sm-dlg--wide" id="dlgTitle" aria-label="Title editor"><div id="titleBody"></div></dialog>
    <div class="sm-toast" id="toast" role="status" aria-live="polite"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3"></script>
    <script src="supabase-config.js"></script>
    <script src="avatar-frames.js"></script>
    <script src="name-titles.js"></script>
    <script>
    (function () {
        'use strict';
        var CFG = window.SPECSOFT_CONFIG || {};
        var sb = window.getSupabaseClient ? window.getSupabaseClient()
            : ((window.supabase && CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY) ? window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY) : null);
        var $ = function (id) { return document.getElementById(id); };
        var S = { tab: 'items', items: [], packs: [], codes: [], settings: null, featured: [], sales: [], names: {}, q: '', qKind: 'normal', rtok: 0 };
        var TABS = [['items', 'Items'], ['featured', 'Featured'], ['packs', 'Credit packs'], ['codes', 'Codes'], ['credits', 'Credits & economy'], ['quests', 'Quests'], ['xp', 'XP & levels'], ['gifts', 'Gift items'], ['freemium', 'Free rewards'], ['sales', 'Sales']];

        /* ---------- helpers ---------- */
        function el(tag, props) {
            var n = document.createElement(tag);
            if (props) Object.keys(props).forEach(function (k) {
                var v = props[k]; if (v == null || v === false) return;
                if (k === 'class') n.className = v; else if (k === 'text') n.textContent = v;
                else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v); else n.setAttribute(k, v === true ? '' : v);
            });
            for (var i = 2; i < arguments.length; i++) [].concat(arguments[i]).forEach(function (c) { if (c != null && c !== false) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
            return n;
        }
        var tt;
        function toast(m, bad) { var t = $('toast'); t.textContent = m; t.classList.toggle('is-bad', !!bad); t.classList.add('is-on'); clearTimeout(tt); tt = setTimeout(function () { t.classList.remove('is-on'); }, 3200); }
        function fail(e) { var m = String(e && e.message || e); toast(/user_not_found/.test(m) ? 'No member with that username.' : /not_admin/.test(m) ? 'You are not a store admin.' : /bad_amount/.test(m) ? 'Enter a whole number that is not 0.' : /quest_admin|store_admin_grant_xp|store_admin_xp_lookup|xp_log/.test(m) ? 'Run supabase-store-quests.sql and then supabase-store-xp-admin.sql in Supabase.' : m, true); }
        function fmt(n) { return (Number(n) || 0).toLocaleString('en-US'); }
        function when(iso) { return iso ? new Date(iso).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }) : ''; }
        function toLocalInput(iso) { if (!iso) return ''; var d = new Date(iso); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); }
        function numOrNull(v) { v = String(v == null ? '' : v).trim(); return v === '' ? null : Math.max(0, Math.floor(Number(v))); }
        function confirmIt(m) { return window.confirm(m); }

        /* ---------- generic form dialog ---------- */
        // fields: [{ key, label, type: text|number|textarea|select|checkbox|datetime, options:[[value,label]], hint, wide, required }]
        function openForm(opt) {
            var form = $('dlgForm'), dlg = $('dlg'), inputs = {};
            form.textContent = '';
            var grid = el('div', { class: 'sm-form' });
            opt.fields.forEach(function (f) {
                var v = opt.values && opt.values[f.key], input;
                if (f.type === 'textarea') input = el('textarea', { rows: '3', maxlength: f.max || null });
                else if (f.type === 'select') input = el('select', null, f.options.map(function (o) { return el('option', { value: o[0], text: o[1] }); }));
                else if (f.type === 'frame') {
                    input = el('div', { class: 'sm-framefield' });
                    input._frame = v || null;
                    var fpv = el('span', { class: 'sp-avatar', style: '--sp-size:56px', text: 'A' });
                    var paintF = function () { if (window.SpecFrames) window.SpecFrames.apply(fpv, input._frame); };
                    input.appendChild(fpv);
                    input.appendChild(el('button', { type: 'button', class: 'sm-btn', text: 'Open frame designer', onclick: function () { openDesigner(input._frame, function (fr) { input._frame = fr; paintF(); }); } }));
                    paintF();
                }
                else if (f.type === 'title') {
                    input = el('div', { class: 'sm-framefield' });
                    input._title = v || null;
                    var tpv = el('span', { class: 'sm-titlepv' });
                    var paintT = function () { if (window.SpecTitles) window.SpecTitles.apply(tpv, input._title); if (!tpv.firstChild) tpv.textContent = 'No title yet'; };
                    input.appendChild(tpv);
                    input.appendChild(el('button', { type: 'button', class: 'sm-btn', text: 'Open title editor', onclick: function () { openTitleEditor(input._title, function (t) { input._title = t; paintT(); }); } }));
                    paintT();
                }
                else if (f.type === 'multi') input = el('div', { class: 'sm-multi' }, f.options.length ? f.options.map(function (o) {
                    var cb = el('input', { type: 'checkbox', value: o[0] });
                    if ((v || []).indexOf(o[0]) >= 0) cb.checked = true;
                    return el('label', { class: 'sm-check' }, cb, o[1]);
                }) : el('span', { class: 'sm-note', text: 'No items to pick yet.' }));
                else if (f.type === 'checkbox') input = el('input', { type: 'checkbox' });
                else input = el('input', { type: f.type === 'datetime' ? 'datetime-local' : (f.type || 'text'), min: f.type === 'number' ? '0' : null, placeholder: f.placeholder || null, autocomplete: 'off' });
                if (f.type === 'checkbox') input.checked = !!v;
                else if (f.type === 'datetime') input.value = toLocalInput(v);
                else if (f.type !== 'multi' && f.type !== 'frame' && f.type !== 'title') input.value = v == null ? '' : v;
                inputs[f.key] = input;
                var box = el('div', { class: 'sm-field' + (f.wide ? ' sm-wide' : '') });
                if (f.type === 'checkbox') box.appendChild(el('label', { class: 'sm-check' }, input, f.label));
                else { box.appendChild(el('label', { text: f.label })); box.appendChild(input); }
                if (f.hint) box.appendChild(el('div', { class: 'sm-hint', text: f.hint }));
                grid.appendChild(box);
            });
            var save = el('button', { type: 'submit', class: 'sm-btn sm-btn--primary', text: opt.saveLabel || 'Save' });
            form.appendChild(el('h3', { text: opt.title }));
            form.appendChild(grid);
            if (opt.preview) {
                var pv = opt.preview(inputs);
                form.insertBefore(pv.node, grid);
                grid.addEventListener('input', pv.update);
                grid.addEventListener('change', pv.update);
                pv.update();
            }
            form.appendChild(el('div', { class: 'sm-dlg-foot' }, el('button', { type: 'button', class: 'sm-btn', text: 'Cancel', onclick: function () { dlg.close(); } }), save));
            form.onsubmit = async function (e) {
                e.preventDefault();
                var out = {};
                for (var i = 0; i < opt.fields.length; i++) {
                    var f = opt.fields[i], inp = inputs[f.key], val;
                    if (f.type === 'frame') val = inp._frame;
                    else if (f.type === 'title') val = inp._title;
                    else if (f.type === 'multi') val = Array.from(inp.querySelectorAll('input:checked')).map(function (x) { return x.value; });
                    else if (f.type === 'checkbox') val = inp.checked;
                    else if (f.type === 'number') val = f.nullable ? numOrNull(inp.value) : (inp.value === '' ? null : Number(inp.value));
                    else if (f.type === 'datetime') val = inp.value ? new Date(inp.value).toISOString() : null;
                    else { val = inp.value.trim(); if (val === '' && f.nullable) val = null; }
                    if (f.required && (val == null || val === '' || (f.type === 'number' && isNaN(val)))) { toast('Fill in: ' + f.label, true); inp.focus(); return; }
                    out[f.key] = val;
                }
                save.disabled = true;
                try { await opt.onSave(out); dlg.close(); } catch (err) { fail(err); } finally { save.disabled = false; }
            };
            dlg.showModal();
            var first = form.querySelector('input,textarea,select'); if (first) first.focus();
        }

        /* ---------- data ---------- */
        async function loadAll() {
            var r = await Promise.all([
                sb.from('store_items').select('*').order('sort', { ascending: true }).order('created_at', { ascending: true }),
                sb.from('credit_packs').select('*').order('sort', { ascending: true }),
                sb.from('apex_codes').select('*').order('created_at', { ascending: false }),
                sb.from('store_settings').select('*').eq('id', 1).maybeSingle(),
                sb.rpc('store_featured')
            ]);
            for (var i = 0; i < r.length; i++) if (r[i].error) throw r[i].error;
            S.items = r[0].data || []; S.packs = r[1].data || []; S.codes = r[2].data || [];
            S.settings = r[3].data; S.featured = r[4].data || [];

        }
        function editFrPool(p) {

                { key: 'label', label: 'Name for you (optional)', nullable: true, hint: 'Only shown here in the manager.' },
                { key: 'amount_min', label: 'Minimum amount (Credits / XP only)', type: 'number' },

                { key: 'sort', label: 'Sort order', type: 'number' },

                onSave: async function (o) {

        async function renderFreemium(root) {

                el('div', { class: 'sm-bar', style: 'margin-top:12px' }, el('button', { class: 'sm-btn', text: 'Edit settings', onclick: function () {

                        { key: 'active', label: 'Free rewards are on', type: 'checkbox', wide: true },
                        { key: 'cooldown_minutes', label: 'Minutes between claims', type: 'number', required: true, hint: '300 = 5 hours. Lower it to test, then put it back.' },
                        { key: 'ad_seconds', label: 'Ad length in seconds (placeholder timer)', type: 'number', required: true, hint: '0 to 120. The server refuses a claim that comes in faster than this.' },
                        { key: 'credits', label: 'Guaranteed credits', type: 'number', required: true },
                        { key: 'xp', label: 'Guaranteed XP', type: 'number', required: true },
                        { key: 'booster_tier', label: 'Guaranteed booster strength', type: 'select', options: [['2', '2x'], ['3', '3x'], ['5', '5x']] },
                        { key: 'booster_minutes', label: 'Guaranteed booster minutes', type: 'number', required: true, hint: '1 to 1440. 15 = 15 minutes.' },

                        { key: 'shield_every', label: 'Streak shield: earn one every this many streak', type: 'number', required: true, hint: '7 = a shield at streak 7, 14, 21... 0 turns shields off.' },
                        { key: 'shield_max', label: 'Streak shield: most a member can hold', type: 'number', required: true, hint: '3 is a good start. 0 turns shields off.' },
                        { key: 'shield_grace_hours', label: 'Streak shield: extra hours after the reset to still be saved', type: 'number', required: true, hint: '12 = a member who claims up to 12 hours after the streak would reset keeps it (and uses one shield).' }],
                        onSave: async function (o) {
                            var row = { active: !!o.active, cooldown_hours: clampInt(o.cooldown_minutes, 1, 10080) / 60, ad_seconds: clampInt(o.ad_seconds, 0, 120), credits: clampInt(o.credits, 0, 100000), xp: clampInt(o.xp, 0, 100000),
                                booster_tier: Number(o.booster_tier) || 2, booster_minutes: clampInt(o.booster_minutes, 1, 1440), pity_limit: clampInt(o.pity_limit, 0, 1000),
                                streak_warn_hours: Math.min(720, Math.max(0.01, Number(o.streak_warn_hours) || 11)), streak_reset_hours: Math.min(720, Math.max(0.01, Number(o.streak_reset_hours) || 12)),
                                shield_every: clampInt(o.shield_every, 0, 1000), shield_max: clampInt(o.shield_max, 0, 100), shield_grace_hours: Math.min(720, Math.max(0.01, Number(o.shield_grace_hours) || 12)), updated_at: new Date().toISOString() };

                el('div', { class: 'sm-stat' }, el('strong', { text: String(act.length) }), el('span', { text: 'Active rewards in the pool' })),

                el('span', { class: 'sm-note', text: 'Each offer rolls 3 different reward types from here. Members never see the odds or the cards before they pick.' })));
            var list = el('div', { class: 'sm-list' });

            pool.forEach(function (p) {

                list.appendChild(el('div', { class: 'sm-row' + (p.active ? '' : ' is-off') }, el('div', { class: 'sm-thumb', text: FR_KIND_ICON[p.kind] || '🎁' }),

                el('div', { class: 'sm-dlg-foot' }, reset)));
