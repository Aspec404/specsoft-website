<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a0a">
<title>Spectra Code | SPECSOFT®</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="cursor.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="spectra-ai.css">
<link rel="stylesheet" href="spectra-code.css">
</head>
<body class="sa-page sc-page" data-no-footer>
<div class="grid-bg"></div><div class="vignette"></div>
<div class="sc-block"><b>Spectra Code is PC only</b><span>Open it on a computer to build with Spectres.</span><a href="spectra-ai.html">Back to Spectra AI</a></div>

<div class="sc-app">
  <header class="sc-top">
    <nav class="sc-tabs" id="scTabs"></nav>
    <button class="sc-plus" id="scNew" title="New project">+</button>
  </header>

  <aside class="sa-side sc-side">
    <a class="sa-logo" href="index.html" aria-label="SPECSOFT home"><img src="assets/specsoft-logo.png" alt="SPECSOFT"></a>
    <div class="sa-rule"></div>
    <nav class="sa-navs">
      <a class="sa-nav" href="spectra-ai.html"><i class="sa-fi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="3"/><path d="M8 21l3-4"/><path d="M8.5 10.5h.01M12 10.5h.01M15.5 10.5h.01" stroke-width="2.2"/></svg></i><span class="sa-t">Spectra Chat</span></a>
      <a class="sa-nav on" href="spectra-code.html"><i class="sa-fi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M13.5 5l-3 14"/></svg></i><span class="sa-t">Spectra Code</span></a>
      <button class="sa-nav" id="scNew2" type="button"><i class="sa-fi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></i><span class="sa-t">New project</span></button>
    </nav>
    <div class="sa-label">Projects</div>
    <div class="sa-list" id="scHist"></div>
    <div class="sa-rule"></div>
    <a class="sa-acct" href="profile.html" aria-label="Your profile"><span class="sa-ava" data-user-avatar style="--sp-size:40px"></span><span class="sa-t sa-acct-n"><b data-user-name></b><b class="sa-guest" data-guest-only hidden>Log in</b></span></a>
  </aside>

  <main class="sc-main">
    <div class="sc-msgs" id="scMsgs"></div>
    <div class="sc-status" id="scStatus" hidden><i class="sc-dot"></i><span id="scStatusTxt">Orchestrating...</span><small id="scStatusMeta"></small></div>
    <div class="sc-comp"><div class="sc-modes" id="scModes" hidden></div>
      <div class="sc-in"><b>❯</b><textarea id="scIn" rows="2" placeholder="Tell Spectra what to build. Enter to send, Shift+Enter for a new line."></textarea></div>
      <div class="sc-row">
        <button class="sc-plusb" id="scPlus" type="button" aria-label="More options" title="Add files, modes and tools">+</button>
        <select id="scModel" aria-label="Model">
          <optgroup label="Spectrum Series"><option value="2.5">Spectrum 2.5</option><option value="3">Spectrum 3</option><option value="3.5">Spectrum 3.5</option></optgroup>
          <optgroup label="Lumen Series"><option value="lumen4" selected>Lumen 4</option></optgroup>
        </select>
        <label class="sc-eff">Effort <input type="range" id="scEff" min="0" max="3" value="1"><b id="scEffTxt">Medium</b></label>
        <span class="sc-left" id="scLeft"></span>
        <button class="sc-send" id="scSend" aria-label="Build" title="Build (Enter)">↑</button>
      </div>
      <input type="file" id="scFile" multiple hidden accept=".html,.css,.js,.ts,.json,.txt,.md,.py,.lua,.luau,.xml,.svg,.csv">
      <div class="sc-menu" id="scMenu" hidden>
        <button type="button" data-m="files"><b>Add files</b><small>Import html, css, js and more so Spectres can read them</small></button>
        <button type="button" data-m="plan"><b>Plan Mode</b><small>Review the plan before anything is built</small></button>
        <button type="button" data-m="ask"><b>Ask Spectra</b><small>Ask about your code, no files written</small></button>
        <button type="button" data-m="tools"><b>Tools</b><small>Copy, download, clear</small></button>
        <div class="sc-tools" id="scTools" hidden><button type="button" data-t="copy">Copy all files</button><button type="button" data-t="dl">Download all files</button><button type="button" data-t="clear">Clear terminal</button></div>
        <button type="button" data-m="ver"><b>Version Viewer</b><small>Browse and restore older versions of a file</small></button>
      </div>
    </div>
  </main>

  <aside class="sc-panel">
    <div class="sc-ptabs"><button class="on" data-p="sum">Summary</button><button data-p="files">Files</button><button data-p="term">Terminal</button></div>
    <section class="sc-pane on" id="p-sum"></section>
    <section class="sc-pane" id="p-files"></section>
    <section class="sc-pane" id="p-term"><pre class="sc-term" id="scTerm"></pre></section>
  </aside>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3"></script>
<script src="supabase-config.js"></script>
<script src="ban.js"></script>
<script src="main.js?v=3"></script>
<script src="spectra-code.js"></script>
<script src="cursor.js" defer></script>
<script src="gate.js"></script>
<script src="seasons.js"></script>
</body>
</html>
