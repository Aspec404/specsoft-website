<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SPECSOFT® Convergence V3</title>
<noscript><meta http-equiv="refresh" content="0;url=index.html"></noscript>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@800;900&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#000;overflow:hidden;color:#fff;font-family:"Space Grotesk",Arial,sans-serif}
#stage{position:fixed;inset:0;background:#000;overflow:hidden;cursor:pointer}

/* everything that shakes / punches in / fades together */
#cam{position:absolute;inset:0;will-change:transform,opacity}

/* god rays behind the mark */
#rays{position:absolute;left:50%;width:130vmax;height:130vmax;margin-left:-65vmax;margin-top:-65vmax;opacity:0;pointer-events:none;mix-blend-mode:screen;
  background:
    repeating-conic-gradient(from 0deg,rgba(255,255,255,0) 0deg 5deg,rgba(255,255,255,.55) 6deg,rgba(255,255,255,0) 8.5deg 14deg),
    repeating-conic-gradient(from 7deg,rgba(255,255,255,0) 0deg 9deg,rgba(255,255,255,.4) 10.5deg,rgba(255,255,255,0) 12deg 23deg);
  -webkit-mask-image:radial-gradient(closest-side,#000 0%,rgba(0,0,0,.55) 30%,transparent 72%);
  mask-image:radial-gradient(closest-side,#000 0%,rgba(0,0,0,.55) 30%,transparent 72%)}
#glow{position:absolute;left:50%;border-radius:50%;opacity:0;pointer-events:none;
  background:radial-gradient(circle,rgba(255,255,255,.5),rgba(132,132,132,.16) 38%,transparent 68%)}

/* 3D world: grid floor + ceiling, floating shapes, the four marks */
#world{position:absolute;inset:0;perspective:1400px;perspective-origin:50% 50%;will-change:transform}
.pl{position:absolute;left:50%;top:50%;width:110vmax;height:110vmax;margin:-55vmax 0 0 -55vmax;opacity:0;
  background-image:linear-gradient(rgba(250,250,250,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(250,250,250,.5) 1px,transparent 1px);
  background-size:90px 90px;
  -webkit-mask-image:radial-gradient(closest-side,#000 15%,transparent 100%);mask-image:radial-gradient(closest-side,#000 15%,transparent 100%)}
.shp{position:absolute;left:50%;top:50%;opacity:0;overflow:visible}
.ic{position:absolute;left:50%;top:50%;overflow:visible;opacity:0}
.ic path{stroke-dasharray:1;stroke-dashoffset:1;stroke-linejoin:miter}

/* holographic scan line that "prints" the four marks */
#scan{position:absolute;left:50%;height:2px;opacity:0;pointer-events:none;z-index:3;
  background:linear-gradient(90deg,transparent,rgba(237,237,237,.9) 25%,#fff 50%,rgba(237,237,237,.9) 75%,transparent);
  box-shadow:0 0 18px 3px rgba(237,237,237,.65)}

.rg{position:absolute;left:50%;border:1px solid #fff;border-radius:50%;opacity:0;z-index:3;pointer-events:none;
  box-shadow:0 0 18px rgba(237,237,237,.7),inset 0 0 18px rgba(237,237,237,.35)}

/* wordmark */
#wmw{position:absolute;left:50%;transform:translateX(-50%);overflow:hidden;padding:.25em .6em;z-index:4}
#wm{font-family:Orbitron,Eurostile,"Arial Black",sans-serif;font-weight:900;letter-spacing:.1em;text-indent:.1em;line-height:1.15;white-space:nowrap;color:#fff;opacity:0}
#wm sup{font-size:.28em;vertical-align:top;position:relative;top:.35em;margin-left:.15em}
#sw{position:absolute;top:0;bottom:0;left:-30%;width:18%;transform:skewX(-20deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.8),transparent);opacity:0;pointer-events:none}
#ul{position:absolute;left:50%;height:1px;width:0;opacity:0;z-index:4;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(237,237,237,.9) 20%,#fff 50%,rgba(237,237,237,.9) 80%,transparent);
  box-shadow:0 0 10px rgba(237,237,237,.8)}
#ul::before,#ul::after{content:"";position:absolute;top:-2.5px;width:6px;height:6px;background:#fff;transform:rotate(45deg);box-shadow:0 0 8px #ededed}
#ul::before{left:0}#ul::after{right:0}

/* sparks, comets, flares, dust */
#fx{position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}

/* camera dressing */
#flash{position:absolute;inset:0;z-index:6;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 45%,#fff,rgba(255,255,255,.7) 40%,rgba(237,237,237,.2) 80%)}
#vig{position:absolute;inset:0;z-index:7;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,transparent 34%,rgba(0,0,0,.88) 100%)}
#grain{position:absolute;left:-50%;top:-50%;width:200%;height:200%;z-index:7;pointer-events:none;opacity:.055;mix-blend-mode:screen;background-size:160px 160px;animation:gr .6s steps(1) infinite}
@keyframes gr{0%{transform:translate(0,0)}20%{transform:translate(-6%,4%)}40%{transform:translate(5%,-5%)}60%{transform:translate(-4%,-7%)}80%{transform:translate(7%,6%)}}
#flick{position:absolute;inset:0;background:#000;opacity:0;z-index:7;pointer-events:none}
.cb{position:absolute;border:0 solid rgba(255,255,255,.85);opacity:0;z-index:7;pointer-events:none}
#tc{position:absolute;left:50%;transform:translateX(-50%);z-index:7;pointer-events:none;opacity:0;font:500 11px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.3em;color:#fff;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{position:absolute;left:0;right:0;height:0;background:#000;z-index:8;pointer-events:none}
#bt{top:0}#bb{bottom:0}
#cl{position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;opacity:0;z-index:8;pointer-events:none;transform-origin:50% 50%;
  background:linear-gradient(90deg,transparent,#fff 20%,#fff 80%,transparent);box-shadow:0 0 22px 4px rgba(237,237,237,.85)}

#rp{position:fixed;z-index:9;right:calc(env(safe-area-inset-right,0px) + 18px);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);opacity:0;pointer-events:none;transition:opacity 1s;font:500 10px "Space Grotesk",Arial,sans-serif;letter-spacing:.4em;text-transform:uppercase;color:#fff;background:none;border:1px solid rgba(255,255,255,.4);padding:9px 14px;cursor:pointer}
#rp.on{opacity:.5;pointer-events:auto}
#rp.on:hover{opacity:.9;border-color:#fff}
#sk{position:fixed;z-index:9;left:calc(env(safe-area-inset-left,0px) + 18px);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);opacity:0;pointer-events:none;transition:opacity .6s;font:500 10px "Space Grotesk",Arial,sans-serif;letter-spacing:.4em;text-transform:uppercase;color:#fff;background:none;border:1px solid rgba(255,255,255,.25);padding:9px 14px;cursor:pointer}
#sk.on{opacity:.4;pointer-events:auto}
#sk.on:hover{opacity:.85;border-color:#fff}
#sk:focus-visible,#rp:focus-visible{outline:2px solid #ededed;outline-offset:3px}
</style>
</head>
<body>
<div id="stage">
 <div id="cam">
  <div id="rays"></div>
  <div id="glow"></div>
  <div id="world"><div class="pl" id="p1"></div><div class="pl" id="p2"></div></div>
  <div id="scan"></div>
  <div class="rg" id="r1"></div><div class="rg" id="r2"></div><div class="rg" id="r3"></div>
  <div id="wmw"><div id="wm">SPECSOFT<sup>®</sup></div><div id="sw"></div></div>
  <div id="ul"></div>
  <canvas id="fx"></canvas>
 </div>
 <div id="flash"></div>
 <div id="vig"></div>
 <div id="grain"></div>
 <div id="flick"></div>
 <i class="cb" id="cb0"></i><i class="cb" id="cb1"></i><i class="cb" id="cb2"></i><i class="cb" id="cb3"></i>
 <div id="tc">00:00:00:00</div>
 <div class="bar" id="bt"></div><div class="bar" id="bb"></div>
 <div id="cl"></div>
 <button id="sk" aria-label="Skip intro">Skip ›</button>
 <button id="rp" aria-label="Replay intro">Replay</button>
</div>
<script>
(function () {
'use strict';

/* ==========================================================================
   1. REDUCED-MOTION + ROUTING CONFIG   (unchanged behaviour)
   ========================================================================== */
const HOME = 'index.html';
const INTRO_DURATION = 8200;   // ms — matches the V3 timeline
const SKIP_GRACE = 1200;       // ms — ignore early clicks/taps (accidental)

const reduceMotion = window.matchMedia &&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// Anyone who's opted out of motion skips the show entirely
if (reduceMotion) {
    window.location.replace(HOME);
    return;
}

/* ==========================================================================
   2. V3 · MONOCHROME TIMELINE (seconds) — tune the whole film from here
        ACT I    lights up   : letterbox, grid, two comets collide, ignition
        ACT II   the scan    : four marks are "printed" in a hologram stack
        ACT III  convergence : they spiral into one → IMPACT
        ACT IV   title card  : silver fill, sheen, wordmark, rule
        ACT V    shutter     : bars close, CRT line, cut to black
   ========================================================================== */
const T = {
    bars0: .1, bars1: .9,
    cm0: .3, ign: 1.15,                 // comets → ignition
    scan0: 1.2, scan1: 2.3,             // hologram scan
    conv0: 2.3, impact: 3.65,           // convergence → impact
    fill1: 4.15, band0: 4.05, band1: 4.65,
    word0: 4.75, line0: 5.0, sheen0: 5.55,
    x0: 7.15, x1: 7.95                  // shutter
};
const END = INTRO_DURATION / 1000;
const HITS = [{ t: T.ign, k: 6, a: .35 }, { t: T.impact, k: 3.6, a: 1 }];

/* ==========================================================================
   3. SCENE SETUP
   ========================================================================== */
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const stage = $('stage'), cam = $('cam'), world = $('world'), rays = $('rays'), glow = $('glow');
const p1 = $('p1'), p2 = $('p2'), scan = $('scan');
const wmw = $('wmw'), wm = $('wm'), sw = $('sw'), ul = $('ul');
const flash = $('flash'), grain = $('grain'), bt = $('bt'), bb = $('bb'), cl_ = $('cl');
const rp = $('rp'), sk = $('sk');
const flick = $('flick'), tc = $('tc'), CB = [0, 1, 2, 3].map(i => $('cb' + i));
const fx = $('fx'), ctx = fx.getContext('2d');
const RG = [$('r1'), $('r2'), $('r3')];

const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const sm = x => { x = cl(x); return x * x * (3 - 2 * x); };
const bell = x => Math.sin(cl(x) * Math.PI);
const eio = x => { x = cl(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const eoe = x => { x = cl(x); return x >= 1 ? 1 : 1 - Math.pow(2, -10 * x); };
const hitAt = (t, t0, k) => t >= t0 ? Math.exp(-(t - t0) * k) : 0;
const hitSum = t => HITS.reduce((s, h) => s + h.a * hitAt(t, h.t, h.k), 0);
const rnd = n => { const v = Math.sin(n * 127.1 + 311.7) * 43758.5453; return v - Math.floor(v); };   // stable per-frame randomness

// Your logo paths (860×850 viewBox)
const dB = 'M494 954L390 849L634 606L738 710Z';
const dM = 'M344 804L91 550L485 157L589 262L300 551L344 595L761 180L865 283L740 410L888 560L784 663L634 515Z';

let W, H, dpr, barH, FH, CY, W0, LH, SC, SPY, t0 = 0, last = 0, gridY = 0;
let endTimer = null, uiTimer = null, skipTimer = null, canSkip = false, phase = 'idle';

/* --- 4 hero marks + chromatic ghosts + 2 impact "RGB" copies + shapes --- */
const mk = (kind, color) => {
    const s = document.createElementNS(NS, 'svg');
    s.setAttribute('viewBox', '60 130 860 850');
    s.classList.add('ic');
    let extra = '';
    if (kind === 'hero0') {
        extra = '<defs><linearGradient id="sv" gradientUnits="userSpaceOnUse" x1="90" y1="160" x2="890" y2="950"><stop offset="0" stop-color="#555"/><stop offset=".28" stop-color="#ffffff"/><stop offset=".52" stop-color="#8a8a8a"/><stop offset=".78" stop-color="#f4f4f4"/><stop offset="1" stop-color="#5e5e5e"/></linearGradient>' +
                '<linearGradient id="bd"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>' +
                '<clipPath id="cp"><polygon points="485,157 589,262 300,551 344,595 761,180 865,283 740,410 888,560 784,663 634,515 344,804 91,550"/><polygon points="634,606 738,710 494,954 390,849"/></clipPath></defs>' +
                '<g clip-path="url(#cp)"><g transform="skewX(-20)"><rect id="band" x="-500" y="100" width="240" height="950" fill="url(#bd)"/></g></g>';
    }
    s.innerHTML = `<path class="bp" pathLength="1" d="${dB}"/><path class="mp" pathLength="1" d="${dM}"/>` + extra;
    s.bp = s.querySelector('.bp'); s.mp = s.querySelector('.mp');
    [s.bp, s.mp].forEach(p => {
        p.style.fill = 'none';
        if (kind === 'ghost') { p.style.stroke = color; p.style.strokeDashoffset = 0; s.style.mixBlendMode = 'screen'; }
        else if (kind === 'rgb') { p.style.fill = color; p.style.stroke = 'none'; p.style.strokeDashoffset = 0; s.style.mixBlendMode = 'screen'; }
        else { p.style.stroke = '#fff'; p.style.fill = 'rgba(255,255,255,.06)'; }
    });
    world.appendChild(s);
    return s;
};

const GH = [];
for (let i = 0; i < 4; i++) GH.push(
    { e: mk('ghost', '#ededed'), i, lag: .06, o: .5 },
    { e: mk('ghost', '#a0a0a0'), i, lag: .12, o: .38 }
);
const IC = [0, 1, 2, 3].map(i => mk(i ? 'hero' : 'hero0'));
IC[0].bp.style.fill = IC[0].mp.style.fill = 'url(#sv)';
IC[0].bp.style.fillOpacity = IC[0].mp.style.fillOpacity = .06;
const band = $('band');
const RGBc = mk('rgb', '#ededed'), RGBm = mk('rgb', '#a0a0a0');

// floating wireframes with depth-of-field
const SH = [...Array(10)].map(() => {
    const k = Math.floor(Math.random() * 4), sz = 40 + Math.random() * 80;
    const e = document.createElementNS(NS, 'svg');
    e.setAttribute('viewBox', '0 0 100 100');
    e.classList.add('shp');
    e.style.width = e.style.height = sz + 'px';
    e.style.marginLeft = e.style.marginTop = -sz / 2 + 'px';
    e.innerHTML = ['<rect x="8" y="8" width="84" height="84"/>', '<circle cx="50" cy="50" r="44"/>', '<polygon points="50,8 92,90 8,90"/>', '<polygon points="50,4 96,50 50,96 4,50"/>'][k]
        .replace('/>', ' fill="none" stroke="#ffffff" stroke-width="1.5" vector-effect="non-scaling-stroke"/>');
    world.insertBefore(e, world.children[2]);
    return {
        e, x: Math.random() - .5, y: Math.random() - .5, z: -1000 + Math.random() * 900,
        vx: (Math.random() - .5) * 26, vy: (Math.random() - .5) * 26, vz: 50 + Math.random() * 70,
        r: Math.random() * 360, vr: (Math.random() - .5) * 34, o: .16 + Math.random() * .2
    };
});

// film grain tile
(function () {
    const c = document.createElement('canvas'); c.width = c.height = 160;
    const g = c.getContext('2d'), d = g.createImageData(160, 160);
    for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
    g.putImageData(d, 0, 0);
    grain.style.backgroundImage = 'url(' + c.toDataURL() + ')';
})();

/* ==========================================================================
   4. LAYOUT  (cinematic 2.2:1 frame)
   ========================================================================== */
const ts = [0, 1, 2, 3].map(i => T.scan0 + ((i + .5) / 4) * (T.scan1 - T.scan0) - .05);

function rs() {
    W = innerWidth; H = innerHeight; dpr = Math.min(devicePixelRatio || 1, 2);
    fx.width = Math.round(W * dpr); fx.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    barH = W / H >= 1.2 ? cl((H - W / 2.2) / 2, 0, .16 * H) : .06 * H;
    FH = H - 2 * barH;
    CY = H / 2 - .075 * FH;
    W0 = Math.min(.44 * FH, .4 * W);
    LH = W0 * 850 / 860;
    SC = Math.min(.17 * FH, .3 * W) / W0;
    SPY = 1.25 * SC * LH;

    [...IC, ...GH.map(g => g.e), RGBc, RGBm].forEach(e => {
        e.style.width = W0 + 'px'; e.style.height = LH + 'px';
        e.style.marginLeft = -W0 / 2 + 'px'; e.style.marginTop = -LH / 2 + 'px';
    });

    const fs = Math.max(22, Math.min(.06 * W, .09 * FH, 84));
    wmw.style.fontSize = fs + 'px';
    const wTop = CY + LH / 2 + Math.max(14, .045 * FH);
    wmw.style.top = wTop + 'px';
    ul.style.top = (wTop + fs * 1.65 + 4) + 'px';

    const gs = .95 * Math.min(W, FH * 1.4);
    glow.style.width = glow.style.height = gs + 'px';
    glow.style.marginLeft = -gs / 2 + 'px'; glow.style.top = (CY - gs / 2) + 'px';
    rays.style.top = CY + 'px';

    // viewfinder corners + timecode, pinned to the letterboxed frame
    const mx = .045 * W, my = barH + .05 * FH, bs = Math.max(14, .032 * Math.min(W, FH));
    [[mx, my, '1px 0 0 1px'], [W - mx - bs, my, '1px 1px 0 0'], [mx, H - my - bs, '0 0 1px 1px'], [W - mx - bs, H - my - bs, '0 1px 1px 0']].forEach((c, i) => {
        CB[i].style.left = c[0] + 'px'; CB[i].style.top = c[1] + 'px';
        CB[i].style.width = CB[i].style.height = bs + 'px'; CB[i].style.borderWidth = c[2];
    });
    tc.style.top = (H - my - 11) + 'px';
    scan.style.width = (SC * W0 * 1.5) + 'px'; scan.style.marginLeft = -(SC * W0 * .75) + 'px';
}
addEventListener('resize', rs);
rs();

/* ==========================================================================
   5. POSE  (the old convergence, now with spin + fly-by depth)
   ========================================================================== */
function pose(i, t) {
    const k = i - 1.5, ph = t - ts[i];
    const ce = sm((t - ts[i]) / .4) * (1 - sm((t - (T.impact - .5)) / .45));
    const st = (i == 0 || i == 3) ? T.conv0 : T.conv0 + .12;
    const c = eio((t - st) / (T.impact - .05 - st));
    const arc = Math.sin(Math.PI * c);
    const x = k * .17 * W0 * arc;
    const y = k * SPY * (1 - c) + (CY - H / 2) * c;   // stack is centred in the frame, then glides up to the logo spot
    const z = Math.sin(ph * 2.4 + i * .9) * 80 * ce + 170 * arc;
    const rx = Math.sin(ph * 2.8 + i * 1.2) * 16 * ce;
    const ry = (i % 2 ? 1 : -1) * (Math.sin(ph * 2.3 + i * .7) * 24 * ce + 360 * c);
    const rz = k * 6 * arc;
    const s = SC + (1 - SC) * c;
    const op = (i ? 1 - sm((t - (T.impact - .05)) / .12) : 1) * (t > ts[i] - .02 ? 1 : 0);
    return [x, y, z, rx, ry, s, op, rz];
}
const tr = a => `translate3d(${a[0]}px,${a[1]}px,${a[2]}px) rotateX(${a[3]}deg) rotateY(${a[4]}deg) rotateZ(${a[7]}deg) scale(${a[5]})`;

/* ==========================================================================
   6. FX CANVAS — comets, lens flares, anamorphic streaks, dust, sparks
   ========================================================================== */
const MOTES = [...Array(130)].map(() => ({ x: Math.random(), y: Math.random(), z: .25 + Math.random() * .75, ph: Math.random() * 6.28, sp: 1 + Math.random() * 3, vx: (Math.random() - .5) * .012, vy: -.004 - Math.random() * .012 }));
let sparks = [], fired = [], px = 0, py = 0;
addEventListener('pointermove', e => { px = (e.clientX / W - .5) * 2; py = (e.clientY / H - .5) * 2; });

const PAL = ['255,255,255', '237,237,237', '237,237,237', '191,191,191'];
function emit(x, y, vx, vy, life, size) {
    if (sparks.length > 560) return;
    sparks.push({ x, y, vx, vy, age: 0, life, size, c: PAL[(Math.random() * PAL.length) | 0] });
}
function burst(n, v) {
    for (let i = 0; i < n; i++) {
        const a = Math.random() < .5 ? Math.floor(Math.random() * 8) * Math.PI / 4 + (Math.random() - .5) * .3 : Math.random() * 6.2832;
        const sp = v * (.2 + Math.random() * .8);
        emit(W / 2 + (Math.random() - .5) * W0 * .25, CY + (Math.random() - .5) * LH * .25, Math.cos(a) * sp, Math.sin(a) * sp, .5 + Math.random() * .8, 1.8 + Math.random() * 3.6);
    }
}
const BURSTS = [{ t: T.ign, n: 50, v: 560 }, { t: T.impact, n: 170, v: 1150 }];

function streak(x, y, hl, ht, a, rgb) {
    if (a < .004 || hl < 1) return;
    ctx.save();
    ctx.translate(x, y); ctx.scale(hl, ht);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
    g.addColorStop(0, `rgba(${rgb},${a})`);
    g.addColorStop(.3, `rgba(${rgb},${a * .35})`);
    g.addColorStop(1, `rgba(${rgb},0)`);
    ctx.fillStyle = g; ctx.fillRect(-1, -1, 2, 2);
    ctx.restore();
}
function orb(x, y, r, a, rgb) {
    if (a < .004) return;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(${rgb},${a})`);
    g.addColorStop(.5, `rgba(${rgb},${a * .35})`);
    g.addColorStop(1, `rgba(${rgb},0)`);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
}
function ghostRing(x, y, r, a, rgb) {
    ctx.strokeStyle = `rgba(${rgb},${a})`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.stroke();
}
const bez = (P, u) => {
    const v = 1 - u, a = v * v * v, b = 3 * v * v * u, c = 3 * v * u * u, d = u * u * u;
    return { x: a * P[0][0] + b * P[1][0] + c * P[2][0] + d * P[3][0], y: a * P[0][1] + b * P[1][1] + c * P[2][1] + d * P[3][1] };
};
let CPATH = [];
function paths() {
    const yb = barH + FH * .85, yt = barH + FH * .13;
    CPATH = [
        [[-30, yb], [W * .22, yb], [W * .3, yt], [W / 2, CY]],
        [[W + 30, barH + FH * .15], [W * .78, barH + FH * .15], [W * .7, barH + FH * .88], [W / 2, CY]]
    ];
}
paths(); addEventListener('resize', paths);

function drawComet(P, u, a) {
    const N = 26, tl = .32;
    ctx.lineCap = 'round';
    for (let n = 0; n < N; n++) {
        const u0 = u - tl * (n + 1) / N, u1 = u - tl * n / N;
        if (u1 <= 0) continue;
        const A = bez(P, Math.max(0, u0)), B = bez(P, Math.max(0, u1));
        const f = 1 - n / N;
        ctx.strokeStyle = `rgba(${n < 3 ? '255,255,255' : '255,255,255'},${(a * f * f).toFixed(3)})`;
        ctx.lineWidth = .6 + 4.4 * f;
        ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.stroke();
    }
    const hd = bez(P, u);
    orb(hd.x, hd.y, 34, a, '255,255,255');
    orb(hd.x, hd.y, 11, a, '255,255,255');
    // lens-flare ghosts mirrored through the frame centre
    const cx = W / 2, cy = H / 2, vx = cx - hd.x, vy = cy - hd.y;
    [[.45, 20, '237,237,237', .16], [.9, 34, '160,160,160', .1], [1.4, 14, '255,255,255', .14]].forEach(g => {
        orb(cx + vx * g[0], cy + vy * g[0], g[1], g[3] * a, g[2]);
        ghostRing(cx + vx * g[0], cy + vy * g[0], g[1] * 1.25, g[3] * a * .5, g[2]);
    });
    return hd;
}

function drawFx(t, dt, ex, hImp, hIgn, idle) {
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    const vis = 1 - ex;

    // dust catching the light
    const I = .12 + .5 * sm((t - .3) / .9) + 1.3 * hitSum(t) + .3 * idle;
    const R = .5 * Math.min(W, FH);
    for (let i = 0; i < MOTES.length; i++) {
        const m = MOTES[i];
        const X = (((m.x + m.vx * t * (.4 + m.z)) % 1) + 1) % 1 * W - px * 22 * m.z;
        const Y = barH + (((m.y + m.vy * t * (.4 + m.z)) % 1) + 1) % 1 * FH - py * 12 * m.z;
        const dx = X - W / 2, dy = Y - CY;
        const a = m.z * (.05 + .55 * Math.min(1.4, I) * Math.exp(-(dx * dx + dy * dy) / (R * R))) * (.6 + .4 * Math.sin(t * m.sp + m.ph)) * vis * sm(t / .6);
        if (a < .01) continue;
        ctx.fillStyle = `rgba(255,255,255,${a.toFixed(3)})`;
        ctx.beginPath(); ctx.arc(X, Y, .5 + m.z * 1.5, 0, 6.2832); ctx.fill();
    }

    // act I — the two comets
    const cu = Math.pow(cl((t - T.cm0) / (T.ign - T.cm0)), 1.7);
    const ca = (1 - sm((t - T.ign) / .12)) * (t > T.cm0 ? 1 : 0);
    if (ca > .01) CPATH.forEach(P => drawComet(P, cu, ca));

    // anamorphic streaks (the signature lens look)
    const seed = sm((t - .2) / .9) * (1 - sm((t - T.ign) / .2));
    streak(W / 2, CY, W * (.06 + .22 * seed), 2.2, .3 * seed * vis, '246,246,246');
    streak(W / 2, CY, W * .55 * hIgn, 5, .8 * hIgn, '255,255,255');
    streak(W / 2, CY, W * (.22 + .85 * hImp), 7 + 14 * hImp, .95 * Math.min(1, hImp * 1.2) * vis, '243,243,243');
    streak(W / 2, CY, W * (.18 + .7 * hImp), 2.4, Math.min(1, hImp * 1.4) * vis, '255,255,255');
    streak(W / 2, CY, 16 + 34 * hImp, FH * (.1 + .25 * hImp), .5 * hImp * vis, '255,255,255');
    const hold = sm((t - T.impact - .8) / .6) * (1 - ex);
    streak(W / 2, CY, W * (.26 + .03 * idle), 2.4, (.16 + .07 * idle) * hold, '254,254,254');

    // sheen travelling through the mark throws a flare
    const bu = sm((t - T.band0) / (T.band1 - T.band0));
    if (bu > 0 && bu < 1) {
        const bx = W / 2 + (bu - .5) * W0 * 1.1, by = CY - (bu - .5) * LH * .9, ba = bell(bu);
        orb(bx, by, 40, .6 * ba, '255,255,255');
        const cx = W / 2, cy = H / 2;
        orb(cx - (bx - cx) * .7, cy - (by - cy) * .7, 22, .16 * ba, '237,237,237');
        orb(cx - (bx - cx) * 1.3, cy - (by - cy) * 1.3, 14, .12 * ba, '160,160,160');
    }

    // sparks (diamonds, like the mark)
    const d = Math.pow(.04, dt);
    for (let i = sparks.length - 1; i >= 0; i--) {
        const s = sparks[i];
        s.age += dt;
        if (s.age >= s.life) { sparks.splice(i, 1); continue; }
        s.vx *= d; s.vy *= d;
        s.x += s.vx * dt; s.y += s.vy * dt;
        ctx.fillStyle = `rgba(${s.c},${(1 - s.age / s.life).toFixed(3)})`;
        ctx.save();
        ctx.translate(s.x, s.y); ctx.rotate(Math.PI / 4);
        ctx.fillRect(-s.size / 2, -s.size / 2, s.size, s.size);
        ctx.restore();
    }
    // 35mm print: scratches, dust and the odd hair (re-rolled ~14x/s like a real projector)
    const fk = Math.floor(t * 14), fa = sm(t / .6) * (1 - ex);
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineWidth = 1;
    for (let q = 0; q < 2; q++) {
        if (rnd(fk * 7 + q) < .5) {
            const x = rnd(fk * 5 + q + 9) * W, y0 = barH + rnd(fk * 3 + q + 2) * FH * .4, len = FH * (.25 + .6 * rnd(fk * 11 + q));
            ctx.strokeStyle = `rgba(255,255,255,${((.07 + .2 * rnd(fk * 13 + q)) * fa).toFixed(3)})`;
            ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x + (rnd(fk + q) - .5) * 6, y0 + len); ctx.stroke();
        }
    }
    for (let n = 0; n < 9; n++) {
        const r = rnd(fk * 17 + n * 3.7);
        if (r < .45) continue;
        ctx.fillStyle = `rgba(255,255,255,${((.2 + .5 * r) * fa).toFixed(3)})`;
        ctx.beginPath(); ctx.arc(rnd(fk * 19 + n * 5.3) * W, barH + rnd(fk * 23 + n * 7.1) * FH, .5 + 1.7 * rnd(fk * 29 + n), 0, 6.2832); ctx.fill();
    }
    if (rnd(fk * 31) < .18) {
        const x = rnd(fk * 37) * W, y = barH + rnd(fk * 41) * FH;
        ctx.strokeStyle = `rgba(255,255,255,${(.5 * fa).toFixed(3)})`;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.bezierCurveTo(x + 14, y - 10, x + 22, y + 12, x + 40, y + 4); ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';
}

/* ==========================================================================
   7. RENDER LOOP
   ========================================================================== */
function frame() {
    requestAnimationFrame(frame);
    const t = Math.min((performance.now() - t0) / 1000, END);
    const dt = Math.max(0, Math.min(.05, t - last));
    last = t;

    const h = hitSum(t), hImp = hitAt(t, T.impact, 3.6), hIgn = hitAt(t, T.ign, 5);
    const ex = sm((t - T.x0) / (T.x1 - T.x0));
    const idle = t > T.impact + 1 ? .5 + .5 * Math.sin(t * 2.2) : 0;

    BURSTS.forEach((b, i) => { if (!fired[i] && t >= b.t) { fired[i] = true; burst(b.n, b.v); } });

    /* --- letterbox in, shutter out --- */
    const bIn = eio((t - T.bars0) / (T.bars1 - T.bars0));
    const bOut = Math.pow(cl((t - T.x0) / (T.x1 - T.x0)), 3);
    const bh = barH * bIn + (H / 2 - barH * bIn) * bOut;
    bt.style.height = bb.style.height = bh + 'px';
    const lineA = t >= T.x1 - .03 ? 1 - sm((t - T.x1 + .03) / .22) : 0;
    cl_.style.opacity = lineA;
    cl_.style.transform = `scaleX(${(lineA * lineA).toFixed(3)}) scaleY(${(.6 + .4 * lineA).toFixed(3)})`;

    /* --- grid floor / ceiling, dollying toward camera --- */
    gridY += (150 * (1 - sm((t - T.impact + .3) / 1.4)) + 12) * dt;
    const g = sm((t - .2) / .8) * (.3 + .7 * (1 - sm((t - T.impact) / 1.4))) + .55 * hImp;
    p1.style.transform = `translateY(34vh) rotateX(74deg)`;
    p2.style.transform = `translateY(-34vh) rotateX(-74deg)`;
    p1.style.backgroundPosition = `0 ${(gridY % 90).toFixed(1)}px`;
    p2.style.backgroundPosition = `0 ${(-(gridY % 90)).toFixed(1)}px`;
    p1.style.opacity = p2.style.opacity = cl(g * .85);

    /* --- floating shapes with depth of field --- */
    const se = sm((t - .3) / .8) * (1 - sm((t - (T.impact - .3)) / .7));
    SH.forEach(s => {
        const z = s.z + s.vz * t;
        s.e.style.transform = `translate3d(${s.x * W * .95 + s.vx * t}px,${s.y * H * .85 + s.vy * t}px,${z}px) rotate(${s.r + s.vr * t}deg)`;
        s.e.style.opacity = s.o * se;
        const bl = cl(Math.abs(z + 380) / 260, 0, 4);
        s.e.style.filter = bl > .3 ? `blur(${bl.toFixed(1)}px)` : '';
    });

    /* --- rays, glow, flash, rings --- */
    rays.style.transform = `rotate(${(t * 4).toFixed(2)}deg)`;
    rays.style.opacity = cl(.5 * hIgn + .95 * hImp + .3 * sm((t - T.impact - .3) / 1) * (1 - ex) + .08 * idle);
    glow.style.opacity = cl(.32 * sm((t - .6) / 1.4) + .8 * h + .1 * idle) * (1 - ex);
    flash.style.opacity = cl(.2 * hitAt(t, T.ign, 16) + .75 * hitAt(t, T.impact, 12));
    [[T.ign, .5, .8], [T.impact, 1.4, 1], [T.impact + .1, 2.3, 1.2]].forEach((r, i) => {
        const k = cl((t - r[0]) / r[2]), e = RG[i];
        if (t < r[0] || k >= 1) { e.style.opacity = 0; return; }
        const size = Math.min(W, H) * r[1] * (1 - Math.pow(1 - k, 3)) + 6;
        e.style.width = e.style.height = size + 'px';
        e.style.marginLeft = -size / 2 + 'px'; e.style.top = (CY - size / 2) + 'px';
        e.style.opacity = .8 * (1 - k);
    });

    /* --- hologram scan line --- */
    const su = cl((t - T.scan0) / (T.scan1 - T.scan0));
    const top = H / 2 - 1.5 * SPY - .5 * SC * LH, span = 3 * SPY + SC * LH;
    scan.style.top = (top + su * span) + 'px';
    scan.style.opacity = sm((t - T.scan0) / .1) * (1 - sm((t - T.scan1 + .08) / .16));

    /* --- the four marks --- */
    const gl = 4 + 10 * h + 3 * idle;
    IC.forEach((e, i) => {
        const a = pose(i, t), b = pose(i, t + .016), c = pose(i, t - .016);
        const draw = cl((t - ts[i]) / .65), de = 1 - Math.pow(1 - draw, 3);
        e.bp.style.strokeDashoffset = 1 - cl(de / .22);
        e.mp.style.strokeDashoffset = 1 - cl((de - .22) / .78);
        const scr = (W0 / 860) * a[5];
        const sw_ = Math.min(14, 1.7 / Math.max(.05, scr));
        e.bp.style.strokeWidth = e.mp.style.strokeWidth = sw_.toFixed(2);
        const v = (Math.abs(b[0] - c[0]) + Math.abs(b[1] - c[1])) / .032;
        const bl = cl((v - 200) / 400 * 2, 0, 2.2);
        e.style.transform = tr(a);
        e.style.opacity = a[6];
        e.style.filter = (bl > .2 ? `blur(${bl.toFixed(2)}px) ` : '') + `drop-shadow(0 0 ${gl.toFixed(1)}px rgba(246,246,246,.8))`;
    });

    // chromatic trails — only visible while the marks are moving
    GH.forEach(o => {
        const a = pose(o.i, t - o.lag);
        const vis = sm((t - ts[o.i] - .1) / .3) * (1 - sm((t - T.impact) / .15));
        o.e.style.transform = tr(a);
        o.e.style.opacity = o.o * vis * a[6];
        const sc = (W0 / 860) * a[5];
        o.e.bp.style.strokeWidth = o.e.mp.style.strokeWidth = Math.min(14, 1.6 / Math.max(.05, sc)).toFixed(2);
    });

    /* --- impact: silver fill, RGB split, sheen --- */
    const f = sm((t - T.impact) / (T.fill1 - T.impact));
    IC[0].bp.style.fillOpacity = IC[0].mp.style.fillOpacity = .06 + .94 * f;
    band.setAttribute('x', -500 + 1900 * sm((t - T.band0) / (T.band1 - T.band0)));
    const split = hitAt(t, T.impact, 7) * 22;
    RGBc.style.opacity = RGBm.style.opacity = t >= T.impact ? cl(hitAt(t, T.impact, 6) * 1.1) : 0;
    RGBc.style.transform = `translate3d(${-split}px,${CY - H / 2}px,0)`;
    RGBm.style.transform = `translate3d(${split}px,${CY - H / 2}px,0)`;

    /* --- camera: slow dolly + punch + shake + parallax --- */
    const sx = (Math.sin(t * 83) + Math.sin(t * 57 + 1)) * 6 * h, sy = Math.cos(t * 71) * 6 * h;
    const wvx = (Math.sin(t * 12.3) + Math.sin(t * 5.1 + 2)) * .55, wvy = Math.sin(t * 9.7 + 1) * .5;   // projector gate weave
    cam.style.transform = `translate(${(sx - px * 5 + wvx).toFixed(2)}px,${(sy - py * 3 + wvy).toFixed(2)}px) scale(${(1 + .045 * sm(t / END) + .05 * hImp + .05 * ex).toFixed(4)})`;
    cam.style.opacity = 1 - sm((t - (T.x0 + .1)) / .55);

    /* --- wordmark: track-in + flicker, then rule + sheen --- */
    const wp = t - T.word0;
    let wo = 0;
    if (wp >= .55) wo = 1;
    else if (wp >= 0) wo = (Math.sin(t * 180) + Math.sin(t * 97 + 1.3) > .2 ? 1 : .15) * (.4 + .6 * wp / .55);
    const ls = .1 + .45 * Math.pow(1 - cl(wp / 1.1), 3);
    wm.style.opacity = wo;
    wm.style.letterSpacing = ls.toFixed(3) + 'em';
    wm.style.textIndent = ls.toFixed(3) + 'em';
    wm.style.filter = `blur(${(9 * (1 - sm(wp / .9))).toFixed(1)}px)`;
    wm.style.transform = `scale(${(1 + .09 * (1 - sm(wp / 1))).toFixed(4)})`;
    wm.style.textShadow = wp > 0 ? `0 0 ${(4 + 22 * (1 - sm((wp - .3) / 1.4)) + 5 * idle).toFixed(1)}px rgba(237,237,237,.75)` : 'none';
    sw.style.left = (-30 + 130 * sm((t - T.sheen0) / .6)) + '%';
    sw.style.opacity = bell((t - T.sheen0) / .6);
    const lw = Math.min(.5 * W, 560) * eoe((t - T.line0) / .9);
    ul.style.width = lw + 'px'; ul.style.marginLeft = -lw / 2 + 'px';
    ul.style.opacity = t >= T.line0 ? .95 : 0;

    /* --- 35mm dressing: projector flicker, negative strobe, viewfinder --- */
    const fr = rnd(Math.floor(t * 24) * 1.7);
    flick.style.opacity = (.035 * fr + (fr > .94 ? .1 : 0)).toFixed(3);
    const inv = (t >= T.impact && t < T.impact + .07) ? 'invert(1)' : '';   // one negative flash (kept to a single hit for photosensitive viewers)
    if (stage._f !== inv) { stage.style.filter = inv; stage._f = inv; }
    const vf = sm((t - .5) / .4) * (1 - sm((t - T.word0 + .35) / .5));
    CB.forEach(e => { e.style.opacity = (vf * .75).toFixed(3); });
    tc.style.opacity = (vf * .5).toFixed(3);
    const fi = Math.floor(t * 24);
    if (tc._f !== fi) { tc._f = fi; tc.textContent = '00:00:' + String(Math.floor(fi / 24)).padStart(2, '0') + ':' + String(fi % 24).padStart(2, '0'); }

    drawFx(t, dt, ex, hImp, hIgn, idle);
}

/* ==========================================================================
   8. PLAYBACK CONTROL + ROUTING   (same logic as before)
   ========================================================================== */
function clearTimers() {
    clearTimeout(endTimer);
    clearTimeout(uiTimer);
    clearTimeout(skipTimer);
    endTimer = uiTimer = skipTimer = null;
}

function goHome() {
    clearTimers();
    window.location.replace(HOME);
}

function play() {
    clearTimers();
    phase = 'playing';
    canSkip = false;
    rp.classList.remove('on');
    sk.classList.remove('on');
    t0 = performance.now();
    last = 0;
    gridY = 0;
    sparks = [];
    fired = [];

    // Enable skipping after a short grace period (avoid accidental taps)
    skipTimer = setTimeout(() => {
        canSkip = true;
        sk.classList.add('on');
    }, SKIP_GRACE);

    // Show replay when the animation completes
    uiTimer = setTimeout(() => {
        phase = 'done';
        rp.classList.add('on');
        sk.classList.remove('on');
    }, INTRO_DURATION);

    // Auto-redirect home
    endTimer = setTimeout(goHome, INTRO_DURATION);
}

/* --- Interaction wiring --- */
stage.addEventListener('click', () => {
    if (phase === 'playing' && canSkip) {
        goHome();
    }
    // phase === 'done' → do nothing (Replay button handles it)
});

sk.addEventListener('click', e => {
    e.stopPropagation();
    goHome();
});

rp.addEventListener('click', e => {
    e.stopPropagation();
    play(); // restart intro; new timers replace old ones
});

document.addEventListener('keydown', e => {
    if ((e.key === 'Escape' || e.key === 'Enter') && phase === 'playing' && canSkip) {
        goHome();
    }
});

/* ==========================================================================
   9. GO
   ========================================================================== */
play();
requestAnimationFrame(frame);

})();
</script>
