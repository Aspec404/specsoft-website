<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="referrer" content="no-referrer">
    <title>SPECSOFT® Console</title>

    <link rel="icon" type="image/png" href="logo.png">
    <script src="seasons.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin.css">

</head>
<body class="ad-body">
    <script>try{if(localStorage.getItem('specsoft-theme')==='light')document.body.classList.add('light-mode')}catch(e){}</script>

    <noscript><p style="padding:24px;position:fixed;inset:0;background:#000;color:#fff;z-index:99999">This console needs JavaScript.</p></noscript>

    <div class="ad-app" id="adApp">

        <!-- ================= GATE: loading / sign in / password / not found ================= -->
        <section class="ad-gate" id="adGate" aria-live="polite">
            <div class="ad-gate-card" id="adGateCard"></div>
        </section>

        <!-- ================= CONSOLE ================= -->
        <div class="ad-shell" id="adShell" hidden>
            <aside class="ad-side" id="adSide">
                <div class="ad-brand">
                    <img src="logo.png" alt="" width="28" height="28">
                    <div class="ad-brand-text">SPECSOFT<sup>®</sup><em>CONSOLE</em></div>
                </div>

                <nav class="ad-nav" id="adNav" aria-label="Console sections"></nav>

                <div class="ad-side-foot">
                    <div class="ad-me" id="adMe"></div>
                    <div class="ad-timer" id="adTimer" title="The console locks itself after 30 idle minutes"></div>
                    <div class="ad-side-btns">
                        <button type="button" class="ad-btn ad-btn--ghost ad-btn--sm" id="adPwBtn">Change password</button>
                        <button type="button" class="ad-btn ad-btn--sm" id="adLockBtn">Lock now</button>
                    </div>
                </div>
            </aside>

            <main class="ad-main" id="adMain" tabindex="-1">
                <header class="ad-top">
                    <h1 id="adTitle">Dashboard</h1>
                    <span class="ad-top-sub" id="adTopSub"></span>
                </header>
                <div class="ad-view" id="adView"></div>
            </main>
        </div>
    </div>

    <!-- generic modal, filled by admin.js -->
    <dialog class="ad-dlg" id="adDlg" aria-labelledby="adDlgTitle">
        <form method="dialog" id="adDlgForm" novalidate>
            <header class="ad-dlg-head"><h2 id="adDlgTitle"></h2><button type="button" class="ad-x" id="adDlgX" aria-label="Close">&times;</button></header>
            <div class="ad-dlg-body" id="adDlgBody"></div>
            <footer class="ad-dlg-foot" id="adDlgFoot"></footer>
        </form>
    </dialog>

    <div class="ad-toast" id="adToast" role="status" aria-live="polite"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3"></script>
    <script src="supabase-config.js"></script>
    <script src="admin.js"></script>
    
</body>
</html>
